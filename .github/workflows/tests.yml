name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install packages
        run: python -m pip install numpy Pillow
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Command line smoke test
        run: python mhgu_tex_tool.py --version
      - name: Shell scripts parse
        if: runner.os == 'Linux'
        run: bash -n install.sh && bash -n mhgu-texture-tool
